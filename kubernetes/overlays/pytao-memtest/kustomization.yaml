apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: virtual-accelerator
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/slaclab/virtual-accelerator-digital-twin
    newTag: debug-pytao-memtest
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["python", "scripts/pytao_test_script.py"]
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: []
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: virtual-accelerator
configMapGenerator:
  - name: va-config
    namespace: virtual-accelerator
    behavior: create
    literals:
      - LCLS_LATTICE=/opt/lcls-lattice
      - MALLOC_ARENA_MAX=2
      - DURATION_S=0
      - LOG_INTERVAL_S=60
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
