services:

  # ── Development environment ──────────────────────────────────────────
  # Full VA image with lattice files, pytao, torch, p4p — used as the
  # VSCode devcontainer. run.py is volume-mounted so edits are live.
  devenv:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DOCKER_PLATFORM: linux/amd64
    image: va-digital-twin:local
    container_name: va-devenv
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      LCLS_LATTICE: /opt/lcls-lattice
      EPICS_PVA_AUTO_ADDR_LIST: "NO"
      EPICS_PVA_ADDR_LIST: "mock-ioc"
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_ADDR_LIST: "mock-ioc"
      PYEPICS_LIBCA: /opt/conda/epics/lib/linux-x86_64/libca.so
      MODEL: cu_hxr_staged
      END_ELEMENT: OTR4
      N_PARTICLES: "100"
      REMOTE_INPUTS: "true"
      METRICS_PORT: "9090"
      MEM_LOG_INTERVAL_S: "60"
      LOG_LEVEL: INFO
      MALLOC_ARENA_MAX: "1"
      MALLOC_MMAP_THRESHOLD_: "131072"
    ports:
      - "5075:5075/tcp"
      - "9090:9090/tcp"
    depends_on:
      - mock-ioc

  # ── Mock CA/PVA IOC ───────────────────────────────────────────────────
  # Serves the 16 real input PVs with realistic design-value noise.
  # pvua auto-discovers: tries PVA first, falls back to CA.
  mock-ioc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DOCKER_PLATFORM: linux/amd64
    image: va-digital-twin:local
    container_name: mock-ioc
    command: ["python", "scripts/mock_ca_ioc.py"]
    environment:
      UPDATE_RATE_HZ: "1"
      NOISE_SIGMA_PCT: "0.1"
      LOG_LEVEL: INFO
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
